name: OhNews
options:
  bundleIdPrefix: com.nipher
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.3"

packages:
  OhNewsKit:
    path: Packages/OhNewsKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  OhNews:
    type: application
    platform: macOS
    sources:
      - path: OhNews
      # AGPL 要求把完整许可文本随程序一并交给使用者，所以它必须进应用包。
      # 用构建阶段引用根目录的文件，避免在仓库里维护两份副本。
      # LICENSE 必须是逐字一致的官方文本（否则 GitHub 会把许可识别成 Other），
      # 版权声明与商业授权说明因此放在 NOTICE 里。
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: LICENSING.md
        buildPhase: resources
    dependencies:
      - package: OhNewsKit
        product: OhNewsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nipher.OhNews
        PRODUCT_NAME: OhNews
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: OhNews/Support/Info.plist
      properties:
        CFBundleName: OhNews
        CFBundleDisplayName: OhNews
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.news
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright (C) 2026 Nipher. Licensed under AGPL-3.0.
        NSAppTransportSecurity:
          # 仅放开 WKWebView 内容里的 http 外链，不全局放开 ATS
          NSAllowsArbitraryLoadsInWebContent: true
          # 允许本地 Ollama 等局域网 http 服务（不放开公网明文 http）
          NSAllowsLocalNetworking: true
          # RSS 世界里 http 站点仍有不少，用户添加订阅时需要直接抓取（2026-09-12 确认）
          NSAllowsArbitraryLoads: true
    entitlements:
      path: OhNews/Support/OhNews.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  OhNews:
    build:
      targets:
        OhNews: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
