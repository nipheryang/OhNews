name: HeyNews
options:
  bundleIdPrefix: com.nipher
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.3"

packages:
  HeyNewsKit:
    path: Packages/HeyNewsKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  HeyNews:
    type: application
    platform: macOS
    sources:
      - path: HeyNews
    dependencies:
      - package: HeyNewsKit
        product: HeyNewsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nipher.HeyNews
        PRODUCT_NAME: HeyNews
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: HeyNews/Support/Info.plist
      properties:
        CFBundleName: HeyNews
        CFBundleDisplayName: HeyNews
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.news
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: MIT License
        NSAppTransportSecurity:
          # 仅放开 WKWebView 内容里的 http 外链，不全局放开 ATS
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: HeyNews/Support/HeyNews.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  HeyNews:
    build:
      targets:
        HeyNews: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
