name: OhNews
options:
  bundleIdPrefix: com.nipher
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.3"

packages:
  OhNewsKit:
    path: Packages/OhNewsKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  OhNews:
    type: application
    platform: macOS
    sources:
      - path: OhNews
    dependencies:
      - package: OhNewsKit
        product: OhNewsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nipher.OhNews
        PRODUCT_NAME: OhNews
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: OhNews/Support/Info.plist
      properties:
        CFBundleName: OhNews
        CFBundleDisplayName: OhNews
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.news
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Proprietary software © 2026 Nipher
        NSAppTransportSecurity:
          # 仅放开 WKWebView 内容里的 http 外链，不全局放开 ATS
          NSAllowsArbitraryLoadsInWebContent: true
          # 允许本地 Ollama 等局域网 http 服务（不放开公网明文 http）
          NSAllowsLocalNetworking: true
          # RSS 世界里 http 站点仍有不少，用户添加订阅时需要直接抓取（2026-09-12 确认）
          NSAllowsArbitraryLoads: true
    entitlements:
      path: OhNews/Support/OhNews.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  OhNews:
    build:
      targets:
        OhNews: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
